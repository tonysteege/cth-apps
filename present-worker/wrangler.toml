name = "cth-present-api"
main = "worker.js"
compatibility_date = "2026-08-24"
workers_dev = false

routes = [
  { pattern = "apps-api.coachtonyhockey.com/*", zone_name = "coachtonyhockey.com" },
]

# Workers AI powers the CTH Bots endpoints. No key: inference is billed to
# this Cloudflare account, which is why the bots need no secret at all.
[ai]
binding = "AI"

# CTH Diagrams Notion keeps its embeddable diagrams here: public reads,
# writes gated by the DG_EDIT_KEY secret (Tony's edit key).
[[kv_namespaces]]
binding = "DG"
id = "ac2eee393d714cebbfcc6e560166d87f"

# CTH Videos (2026-09-12): the library index (one JSON per video plus an
# `index` list) and the bucket the bytes live in, untouched. Writes are gated
# by the VIDEOS_KEY secret (npx wrangler secret put VIDEOS_KEY).
[[kv_namespaces]]
binding = "VIDEOS"
id = "089691b1fc8f4c99b8a57eaa3d3c6b34"

[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "cth-videos"
