<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Video</title><meta name="description" content="Merge video files privately in your browser"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="../diagrams/css/app.css"><style>html,body{min-height:100%;background:var(--page)}body{min-height:100dvh}.app{min-height:100dvh}.head{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(16px,3vw,32px);background:var(--cloud);border-bottom:1px solid var(--edge)}.brand{display:flex;align-items:center;gap:11px}.brand svg{width:30px}.brand h1{margin:0;font-size:20px}.private{color:var(--mist);font-size:12px}.main{width:min(760px,calc(100% - 32px));margin:auto;padding:24px 0}.drop{display:grid;place-items:center;gap:7px;min-height:150px;padding:24px;border:1.5px dashed var(--n-300);border-radius:16px;background:var(--cloud);text-align:center;cursor:pointer}.drop:hover,.drop.over{border-color:var(--n-500);background:var(--n-50)}.drop svg{width:28px}.drop strong{font-size:14px}.drop span,.note{color:var(--mist);font-size:12px}#files{display:none}.panel,.progress,.result{margin-top:16px;background:var(--cloud);border:1px solid var(--edge);border-radius:16px;box-shadow:var(--shadow-card);overflow:hidden}.panel[hidden],.progress[hidden],.result[hidden],.error[hidden]{display:none}.ph{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid var(--edge)}.ph strong{font-size:14px;font-weight:700}.count{padding:2px 6px;border-radius:6px;background:var(--n-200);color:var(--n-500);font-size:11px}.list{padding:6px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;min-height:48px;padding:6px 8px;border-radius:10px}.row:nth-child(even){background:var(--n-50)}.name{min-width:0}.name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-w " hidden><div class="ph"><strong>Video Order</strong><span class="count" id="count"></span></div><div class="list" id="list"></div><div class="foot"><span class="summary" id="summary"></span><button class="btn" id="add">Add Videos</button><button class="btn btn-ink" id="merge">Merge Videos</button></div></section><section class="progress" id="progress" hidden><div class="pt"><strong id="pl">Preparing videos</strong><span id="pv">0%</span></div><div class="track"><div class="bar" id="bar"></div></div></section><section class="result" id="result" hidden><div class="rc"><strong>Your merged video is ready</strong><span id="meta"></span></div><a class="btn btn-ink" id="download" download>Download</a></section><div class="error" id="error" hidden></div><p class="note">The merge runs at playback speed so your browser can combine the picture and sound without uploading anything. Keep this embed open until the download is ready.</p></main></div><script type="module">const $=id=>document.getElementById(id),input=$('files'),drop=$('drop'),panel=$('panel'),list=$('list'),count=$('count'),summary=$('summary'),merge=$('merge'),progress=$('progress'),result=$('result'),error=$('error');let items=[],busy=false,out='';const bytes=n=>n<1048576?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(n<10485760?1:0)+' MB',time=n=>Math.floor(n/60)+':'+Math.round(n%60).toString().padStart(2,'0'),esc=s=>{let d=document.createElement('div');d.textContent=s;return d.innerHTML};function duration(file){return new Promise(r=>{let v=document.createElement('video'),u=URL.createObjectURL(file);v.onloadedmetadata=()=>{URL.revokeObjectURL(u);r(v.duration)};v.onerror=()=>{URL.revokeObjectURL(u);r(0)};v.src=u})}async function add(fs){let videos=[...fs].filter(f=>f.type.startsWith('video/'));if(!videos.length)return fail('Choose video files to continue.');items.push(...await Promise.all(videos.map(async file=>({file,duration:await duration(file)}))));render()}function render(){panel.hidden=!items.length;count.textContent=items.length;let d=items.reduce((s,x)=>s+x.duration,0),b=items.reduce((s,x)=>s+x.file.size,0);summary.textContent=items.length<2?'Add at least two videos':time(d)+' total · '+bytes(b);merge.disabled=items.length<2||busy;list.innerHTML=items.map((x,i)=>'<div class="row"><div class="name"><strong>'+esc(x.file.name)+'</strong><span>'+bytes(x.file.size)+' · '+time(x.duration)+'</span></div><button class="icon" data-up '+(i?'':'disabled')+' aria-label="Move up">↑</button><button class="icon remove" data-r aria-label="Remove">×</button></div>').join('')}function fail(s=''){error.hidden=!s;error.textContent=s}input.onchange=()=>{add(input.files);input.value=''};$('add').onclick=()=>input.click();drop.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();input.click()}};drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');add(e.dataTransfer.files)};list.onclick=e=>{let row=e.target.closest('.row'),i=[...list.children].indexOf(row);if(i<0||busy)return;if(e.target.closest('[data-r]'))items.splice(i,1);if(e.target.closest('[data-up]')&&i)[items[i-1],items[i]]=[items[i],items[i-1]];render()};function loaded(v,u){return new Promise((r,j)=>{v.onloadedmetadata=r;v.onerror=()=>j(Error('One selected video could not be read.'));v.src=u})}async function run(){if(busy)return;fail();result.hidden=true;busy=true;render();progress.hidden=false;try{if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw Error('Open this embed in Chrome or Edge to merge videos.');let c=document.createElement('canvas'),x=c.getContext('2d'),v=document.createElement('video');v.playsInline=true;let u=URL.createObjectURL(items[0].file);await loaded(v,u);let scale=Math.min(1,1920/v.videoWidth,1080/v.videoHeight);c.width=Math.round(v.videoWidth*scale/2)*2;c.height=Math.round(v.videoHeight*scale/2)*2;URL.revokeObjectURL(u);let ac=new AudioContext;await ac.resume();let dest=ac.createMediaStreamDestination(),src=ac.createMediaElementSource(v);src.connect(dest);let stream=c.captureStream(30);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));let mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(MediaRecorder.isTypeSupported)||'',rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8000000}:{}),chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);let stopped=new Promise(r=>rec.onstop=r);rec.start(1000);let total=items.reduce((s,i)=>s+i.duration,0)||1,done=0;for(let i=0;i<items.length;i++){u=URL.createObjectURL(items[i].file);await loaded(v,u);$('pl').textContent='Merging '+(i+1)+' of '+items.length;let z=Math.min(c.width/v.videoWidth,c.height/v.videoHeight),w=v.videoWidth*z,h=v.videoHeight*z,raf,draw=()=>{x.fillStyle='#000';x.fillRect(0,0,c.width,c.height);if(v.readyState>=2)x.drawImage(v,(c.width-w)/2,(c.height-h)/2,w,h);let p=Math.min(99,(done+v.currentTime)/total*100);$('bar').style.width=p+'%';$('pv').textContent=Math.round(p)+'%';if(!v.ended)raf=requestAnimationFrame(draw)};await v.play();draw();await new Promise((r,j)=>{v.onended=r;v.onerror=()=>j(Error('Could not merge '+items[i].file.name+'.'))});cancelAnimationFrame(raf);done+=items[i].duration;URL.revokeObjectURL(u)}rec.stop();await stopped;stream.getTracks().forEach(t=>t.stop());await ac.close();let blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});if(out)URL.revokeObjectURL(out);out=URL.createObjectURL(blob);$('download').href=out;$('download').download=(items[0].file.name.replace(/\.[^.]+$/,'')||'video')+'-merged.webm';$('meta').textContent=bytes(blob.size)+' · WebM video';progress.hidden=true;result.hidden=false}catch(e){fail(e.message||'The videos could not be merged.');progress.hidden=true}finally{busy=false;render()}}merge.onclick=run;window.onbeforeunload=()=>out&&URL.revokeObjectURL(out);render()</script></body></html>
