<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTH Apps</title>
  <meta name="description" content="The home for Coach Tony Hockey's web apps.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%230a0a0a%22%20stroke-width%3D%221.8%22%3E%3Crect%20x%3D%223%22%20y%3D%223%22%20width%3D%227.5%22%20height%3D%227.5%22%20rx%3D%222.2%22%2F%3E%3Crect%20x%3D%2213.5%22%20y%3D%223%22%20width%3D%227.5%22%20height%3D%227.5%22%20rx%3D%222.2%22%2F%3E%3Crect%20x%3D%223%22%20y%3D%2213.5%22%20width%3D%227.5%22%20height%3D%227.5%22%20rx%3D%222.2%22%2F%3E%3Crect%20x%3D%2213.5%22%20y%3D%2213.5%22%20width%3D%227.5%22%20height%3D%227.5%22%20rx%3D%222.2%22%2F%3E%3C%2Fsvg%3E">
  <link rel="apple-touch-icon" href="diagrams/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* BoardUI design system - same tokens as diagrams/css/app.css */
    :root {
      --n-50: #fafafa; --n-100: #f7f7f7; --n-200: #ebebeb; --n-300: #d4d4d4;
      --n-400: #a3a3a3; --n-500: #737373; --n-600: #525252; --n-700: #404040;
      --n-950: #0a0a0a;
      --a-50: #fafafa; --a-100: #f7f7f7; --a-500: #171717; --a-600: #0a0a0a; --a-700: #000000;
      --shadow-card: 0 1px 1px 0 rgb(0 0 0 / 0.05);
      --shadow-2: 0 1px 2px 0 rgb(0 0 0 / 0.06), 0 1px 3px 0 rgb(0 0 0 / 0.10);
      --dur: 150ms;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
      font-weight: 400; color: var(--n-950); background: var(--n-100);
      -webkit-font-smoothing: antialiased;
      display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 22px clamp(20px, 4vw, 48px) 18px;
      border-bottom: 1px solid var(--n-200);
      background: #fff;
    }
    header img { height: 30px; }
    header h1 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1; }
    main {
      flex: 1;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr));
      gap: 14px; align-content: start;
      padding: 28px clamp(20px, 4vw, 48px);
      width: 100%; max-width: 1100px; margin: 0 auto;
    }
    /* Compact tiles: icon, name, arrow. No description - the names carry
       the meaning and a short board beats a tall one (2026-08-27). */
    .app-card {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      text-decoration: none; color: inherit;
      background: #fff; border: 1px solid var(--n-200);
      border-radius: 16px; padding: 14px 16px;
      box-shadow: var(--shadow-card);
      transition: box-shadow var(--dur) ease, transform var(--dur) ease, border-color var(--dur) ease;
    }
    .app-card:hover { box-shadow: var(--shadow-2); transform: translateY(-1px); border-color: var(--n-300); }
    .app-card:focus-visible { outline: 2px solid var(--a-500); outline-offset: 2px; }
    .app-card:active { transform: scale(0.99); }
    .app-card .ic {
      flex: none;
      width: 44px; height: 44px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      background: var(--n-100); color: var(--n-700);
      border: 1px solid var(--n-200);
      transition: background var(--dur) ease, color var(--dur) ease, border-color var(--dur) ease;
    }
    .app-card:hover .ic { background: var(--a-50); color: var(--a-700); border-color: var(--a-100); }
    .app-card .ic svg { width: 24px; height: 24px; }
    .app-card h2 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; }
    .app-card .go {
      flex: none;
      color: var(--n-300); display: flex;
      transition: color var(--dur) ease, transform var(--dur) ease;
    }
    .app-card .go svg { width: 18px; height: 18px; }
    .app-card:hover .go { color: var(--a-600); transform: translateX(2px); }
    footer {
      padding: 18px clamp(20px, 4vw, 48px) 26px;
      color: var(--n-400); font-size: 12px; letter-spacing: 0.15px; text-align: center;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <img src="diagrams/assets/cth-icon-black.svg" alt="CTH">
    <h1>CTH Apps</h1>
  </header>
  <main>
    <a class="app-card" href="boards/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="14.5" height="11" rx="2"/><path d="M20.5 9v6"/><path d="m8.6 10 4.6 2.5-4.6 2.5z" fill="currentColor" stroke="none"/></svg></div>
      <h2>Boards</h2>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="app-card" href="bots/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2m16 0h2m-7-1v2m-6-2v2"/></svg></div>
      <h2>Bots</h2>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="app-card" href="clips/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.75" y="5" width="18.5" height="14" rx="3"/><path d="m10 9.2 5 2.8-5 2.8z" fill="currentColor" stroke="none"/></svg></div>
      <h2>Clips</h2>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="app-card" href="diagrams/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="6.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.4"/></svg></div>
      <h2>Diagrams</h2>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
    <a class="app-card" href="slides/">
      <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.75" y="4" width="18.5" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg></div>
      <h2>Slides</h2>
      <span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
    </a>
  </main>
  <footer>Coach Tony Hockey</footer>
</body>
</html>
