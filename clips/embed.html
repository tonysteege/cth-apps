<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CTH Clip</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0b; font-family: 'Inter', -apple-system, sans-serif; }
    .wrap { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    video { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: #0b0b0b; }
    .bar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; color: #fff; background: #161616; font-size: 13px; font-weight: 500;
    }
    .bar b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar button {
      border: 1px solid #3a3a3a; background: #1f1f1f; color: #fff; font: inherit;
      border-radius: 7px; padding: 4px 12px; cursor: pointer;
    }
    .bar button.on { background: #fff; color: #111; border-color: #fff; }
    .spacer { flex: 1; }
    .mark { color: #969696; font-size: 11.5px; }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="v" playsinline controls></video>
    <div class="bar">
      <b id="t">Clip</b>
      <span class="spacer"></span>
      <button id="replay">Replay</button>
      <button id="loop">Loop</button>
      <span class="mark">CTH Clips</span>
    </div>
  </div>
  <script>
    // A one-clip player: #v=<streamUrl>&in=<s>&out=<s>&t=<title>. Made to be
    // pasted into Notion as an Embed - it plays exactly the clip, nothing else.
    const q = new URLSearchParams(location.hash.slice(1));
    const v = document.getElementById('v');
    const IN = Math.max(0, parseFloat(q.get('in') || '0') || 0);
    const OUT = parseFloat(q.get('out') || '0') || 0;
    let loop = false;
    document.getElementById('t').textContent = q.get('t') || 'Clip';
    document.title = (q.get('t') || 'Clip') + ' - CTH Clips';
    v.src = q.get('v') || '';
    const toIn = () => { v.currentTime = IN; };
    v.addEventListener('loadedmetadata', toIn);
    v.addEventListener('timeupdate', () => {
      if (OUT > IN && v.currentTime >= OUT) {
        if (loop) { toIn(); v.play(); } else { v.pause(); }
      }
    });
    v.addEventListener('play', () => { if (OUT > IN && (v.currentTime < IN - 0.5 || v.currentTime >= OUT)) toIn(); });
    document.getElementById('replay').onclick = () => { toIn(); v.play(); };
    document.getElementById('loop').onclick = (e) => { loop = !loop; e.target.classList.toggle('on', loop); };
  </script>
</body>
</html>
