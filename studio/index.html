<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CTH Studio</title>
  <meta name="description" content="Turn game film into telestrated analysis videos for players, teams, courses and social.">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <!-- The version token is bumped by hand whenever app.css changes in a way a
       stale copy would break. GitHub Pages caches aggressively, and this repo
       has already been bitten once by a cached asset it could not recall. -->
  <link rel="stylesheet" href="css/app.css?v=20260908a">
</head>
<body>
  <div id="app">
    <noscript><p style="padding:20px">CTH Studio needs JavaScript.</p></noscript>
  </div>
  <!-- The film element is never seen. The stage is a canvas so that every
       frame goes through the same compositor the exporter uses; this element
       only decodes and holds a position. -->
  <video id="film" playsinline preload="auto" crossorigin="anonymous"></video>
  <script type="module" src="js/app.js"></script>
</body>
</html>
